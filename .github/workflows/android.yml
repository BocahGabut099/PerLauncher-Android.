
name: Android CI

on:
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk'
    types: [opened, reopened]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.3.13750724'

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust Android JNI bridge
        working-directory: rust-engine
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          test -d "$ANDROID_NDK_HOME"
          cargo ndk -P 21 -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 \
            -o ../app_pojavlauncher/build/rustJniLibs \
            build --release -p perlauncher-android
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -s "../app_pojavlauncher/build/rustJniLibs/$abi/libperlauncher_engine.so"
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Prepare
        run: |
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Build Debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Generate checksum
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PerLauncher-Android-Debug
          path: out/app-debug.*

